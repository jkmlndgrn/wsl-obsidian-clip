name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        # googleapis/release-please-action v4.4.0
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-release-assets:
    name: Build release assets
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      BINARY_NAME: wsl-obsidian-clip
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}

    steps:
      - name: Check out repository
        # actions/checkout v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-tags: true
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Go
        # actions/setup-go v5
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build release packages
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          for arch in amd64 arm64; do
            package_name="${BINARY_NAME}_${RELEASE_TAG}_linux_${arch}"
            package_dir="dist/${package_name}"

            mkdir -p "${package_dir}"
            GOOS=linux GOARCH="${arch}" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags="-s -w" \
              -o "${package_dir}/${BINARY_NAME}" \
              .

            cp README.md LICENSE "${package_dir}/"
            tar -C dist -czf "dist/${package_name}.tar.gz" "${package_name}"
            rm -rf "${package_dir}"
          done

          (cd dist && sha256sum *.tar.gz > checksums.txt)

      - name: Upload package artifacts
        # actions/upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-packages
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error

      - name: Upload packages and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "${RELEASE_TAG}" dist/*.tar.gz dist/checksums.txt --clobber
          gh release edit "${RELEASE_TAG}" --draft=false
